version: '3.8'

services:
  quantum-atlas:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quantum-atlas
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Persist scan results (CBOM, SARIF, reports) on host
      - ./results:/app/results
      # Mount corpus so custom target repos can be added dynamically
      - ./corpus:/app/corpus
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
